name: test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  panasonic-ptz:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: panasonic-ptz
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --ignore-scripts --no-audit --no-fund --legacy-peer-deps @companion-module/base@1.4.3 got@12
      - run: node --test test/steps.test.mjs

  uad-console:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: uad-console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --ignore-scripts --no-audit --no-fund
      - run: node --test test/ua.test.mjs

  ulanzi-d200x:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ulanzi-d200x
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: yarn install
      - run: yarn build

  digico-sd:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: digico-sd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts --no-audit --no-fund --legacy-peer-deps
      - run: npx tsc6 -p tsconfig.build.json
      - run: node --test test/knobs.test.mjs

  grandma2:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: grandma2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --ignore-scripts --no-audit --no-fund
      - run: node --test test/ma2.test.mjs

  apple-music-local:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apple-music-local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --ignore-scripts --no-audit --no-fund
      - run: node --test test/music.test.mjs

  spotify-local:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spotify-local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --ignore-scripts --no-audit --no-fund
      - run: node --test test/spotify.test.mjs

  ndi-studio-monitor:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ndi-studio-monitor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --ignore-scripts --no-audit --no-fund
      - run: node --test test/monitor.test.mjs

  ndi-router:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ndi-router
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --ignore-scripts --no-audit --no-fund
      - run: node --test test/ndi.test.mjs test/virtual-input.test.mjs

  system-tools:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: system-tools
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --ignore-scripts --no-audit --no-fund
      - run: node --test test/apps.test.mjs test/system.test.mjs

  show-health:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: show-health
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --ignore-scripts --no-audit --no-fund
      - run: node --test test/health.test.mjs

  echo360-capture:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: echo360-capture
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --ignore-scripts --no-audit --no-fund
      - run: node --test test/echo.test.mjs

  magicq:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: magicq
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --ignore-scripts --no-audit --no-fund --legacy-peer-deps
      - run: node --test test/knobs.test.mjs

  # Loads every module with its default settings and checks its presets against its own actions and
  # feedbacks (missing actions or options, on/off feedbacks with no style, knobs with no turn actions).
  presets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install every module
        run: |
          for d in apple-music-local echo360-capture grandma2 magicq ndi-router ndi-studio-monitor panasonic-ptz show-health spotify-local system-tools uad-console; do
            (cd "$d" && npm install --no-save --ignore-scripts --no-audit --no-fund)
          done
          (cd digico-sd && npm install --ignore-scripts --no-audit --no-fund --legacy-peer-deps && npx tsc6 -p tsconfig.build.json)
      - run: node tools/preset-check.mjs

  # Compiles every Mac script (AppleScript and JavaScript for Automation) on a real Mac, against the
  # apps' own scripting dictionaries, and runs the ones that are safe without a person at the Mac.
  mac-scripts:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --ignore-scripts --no-audit --no-fund
        working-directory: spotify-local
      - name: Install Spotify (for its scripting dictionary)
        run: brew install --cask spotify || echo "Spotify didn't install; its scripts will be skipped"
      - run: node tools/mac-check.mjs
