    defaults:
      run:
        working-directory: app-launcher
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --ignore-scripts --no-audit --no-fund
      - run: node --test test/apps.test.mjs

  show-health:
