name: release

# Builds an installable package of every module on each merge to main and
# publishes them on the "latest" GitHub release. In Companion:
# Modules -> Import module package -> pick the .tgz. No Node or Terminal needed.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - dir: panasonic-ptz
            install: npm install --ignore-scripts --no-audit --no-fund --legacy-peer-deps
            build: npx companion-module-build
          - dir: uad-console
            install: npm install --ignore-scripts --no-audit --no-fund
            build: npx companion-module-build
          - dir: digico-sd
            install: npm install --ignore-scripts --no-audit --no-fund --legacy-peer-deps
            build: npx tsc6 -p tsconfig.build.json && npx companion-module-build
          - dir: echo360-capture
            install: npm install --ignore-scripts --no-audit --no-fund
            build: npx companion-module-build
          - dir: magicq
            install: npm install --ignore-scripts --no-audit --no-fund --legacy-peer-deps
            build: npx companion-module-build
          - dir: show-health
            install: npm install --ignore-scripts --no-audit --no-fund
            build: npx companion-module-build
          - dir: system-tools
            install: npm install --ignore-scripts --no-audit --no-fund
            build: npx companion-module-build
          - dir: ndi-router
            install: npm install --ignore-scripts --no-audit --no-fund
            build: npx companion-module-build
          - dir: ndi-studio-monitor
            install: npm install --ignore-scripts --no-audit --no-fund
            build: npx companion-module-build
          - dir: spotify-local
            install: npm install --ignore-scripts --no-audit --no-fund
            build: npx companion-module-build
          - dir: apple-music-local
            install: npm install --ignore-scripts --no-audit --no-fund
            build: npx companion-module-build
          - dir: grandma2
            install: npm install --ignore-scripts --no-audit --no-fund
            build: npx companion-module-build
          - dir: ulanzi-d200x
            install: corepack enable && yarn install
            build: yarn build && yarn companion-surface-build
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: ${{ matrix.install }}
      - run: ${{ matrix.build }}
      - uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.dir }}
          path: ${{ matrix.dir }}/*.tgz
          if-no-files-found: error

  publish:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: pkg-*
          merge-multiple: true
          path: packages
      - name: Publish the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp ulanzi-d200x/extras/D200X-layout.companionconfig packages/
          cp system-tools/extras/pages/D200X-pages.companionconfig packages/
          mkdir -p bundle
          bash tools/make-bundle.sh packages bundle/companion-tools-all-modules.tgz
          ls -l packages bundle
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest bundle/companion-tools-all-modules.tgz packages/*.tgz packages/*.companionconfig \
            --title "Latest build ($(date -u +%Y-%m-%d) ${GITHUB_SHA::7})" \
            --notes "Installable Companion module packages, built from main at ${GITHUB_SHA::7}.

          **Install or update everything at once:** download **companion-tools-all-modules.tgz**, then Companion → **Modules** → **Import offline module bundle** (the blue button; *Import Bundle* in newer Companion). Then pick the new versions on your connections / the D200X surface (or let System Tools' auto-update do the connections: SETUP-GUIDE.md, Part I).

          **One module:** Companion → **Modules** → **Import module package** → choose its .tgz.

          **D200X template page:** Import / Export → Import → D200X-layout.companionconfig, into an empty page. It labels every key and knob.

          **Ready-made D200X pages (Mac), all in one file:** D200X-pages.companionconfig. Import / Export → Import → the **Buttons** tab (not Full Import): pick a page from the file, pick an empty page of yours, match the connections to your System Tools and Spotify ones, Import. Repeat for any other pages you want, without loading the file again.

          See SETUP-GUIDE.md for the full walkthrough."
